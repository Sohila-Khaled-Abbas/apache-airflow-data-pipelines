name: Airflow CI & DAG Integrity Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-validate:
    name: Lint & Verify DAG Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Apache Airflow & Project Dependencies
        run: |
          python -m pip install --upgrade pip
          AIRFLOW_VERSION=3.1.8
          PYTHON_VERSION=3.12
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.astro,venv,.venv,__pycache__,spark,course-materials
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics --exclude=.astro,venv,.venv,__pycache__,spark,course-materials

      - name: Verify Python Imports & Syntax
        env:
          AIRFLOW_HOME: ${{ github.workspace }}
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from airflow.models import Variable; print('OK: Variable from airflow.models')"
          python -c "from airflow.hooks.base import BaseHook; print('OK: BaseHook from airflow.hooks.base')"
          python -c "from airflow.sdk import dag, task, task_group, PokeReturnValue, Asset; print('OK: SDK imports')"
          python -c "from include.datasets import Dataset_cocktail; print('OK: Dataset_cocktail')"
          python -c "from include.stock_market.tasks import _get_minio_client, _get_stock_prices, _store_prices, _get_formatted_csv; print('OK: Stock market tasks')"
          python -c "from include.tasks import _get_cocktail, _check_size, _check_json_data; print('OK: Cocktail tasks')"
          python -c "import dags.stock_market, dags.extractor, dags.cocktail_loader, dags.ecom, dags.celery_parallelism_demo; print('OK: All root DAG modules')"
          python -m py_compile infra/celery/dags/celery.py spark/notebooks/stock_transform/stock_transform.py

      - name: Run DAG Integrity, Unit & AST Architecture Tests
        env:
          AIRFLOW_HOME: ${{ github.workspace }}
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__UNIT_TEST_MODE: "True"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          airflow db migrate
          pytest tests/ -v --tb=short
