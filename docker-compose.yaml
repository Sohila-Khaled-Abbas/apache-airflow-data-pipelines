version: "3.8"

services:
  ###########################################################################
  # Backing services
  ###########################################################################
  postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - airflow-net

  redis:
    image: redis:7-alpine
    container_name: airflow-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - airflow-net

  ###########################################################################
  # Airflow bootstrap
  ###########################################################################
  airflow-init:
    image: apache/airflow:3.1.8-python3.12
    container_name: airflow-init
    entrypoint: /bin/sh
    command: >
      -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin
      --lastname User --role Admin --email admin@example.com || true"
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: redis://redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - airflow-net

  ###########################################################################
  # Airflow core services (Celery executor)
  ###########################################################################
  webserver:
    image: apache/airflow:3.1.8-python3.12
    container_name: airflow-webserver
    ports:
      - "8080:8080"
    command: webserver
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - airflow-net
    restart: unless-stopped

  scheduler:
    image: apache/airflow:3.1.8-python3.12
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: redis://redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-net
    restart: unless-stopped

  worker:
    image: apache/airflow:3.1.8-python3.12
    container_name: airflow-worker
    command: celery worker
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: redis://redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow
      AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW__CORE__PARALLELISM:-6}
      AIRFLOW__CELERY__WORKER_PREFETCH_MULTIPLIER: 1
      AIRFLOW__CELERY__TASK_ACKS_LATE: "True"
      AIRFLOW__CELERY__WORKER_MAX_TASKS_PER_CHILD: 200
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - airflow-net
    restart: unless-stopped

  triggerer:
    image: apache/airflow:3.1.8-python3.12
    container_name: airflow-triggerer
    command: triggerer
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-net
    restart: unless-stopped

  dag-processor:
    image: apache/airflow:3.1.8-python3.12
    container_name: airflow-dag-processor
    command: dag-processor
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-net
    restart: unless-stopped

  flower:
    image: apache/airflow:3.1.8-python3.12
    container_name: airflow-flower
    command: celery flower
    ports:
      - "5555:5555"
    environment:
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - airflow-net
    restart: unless-stopped

volumes:
  postgres-db-volume:

networks:
  airflow-net:
    driver: bridge
